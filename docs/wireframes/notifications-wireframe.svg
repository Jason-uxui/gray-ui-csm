<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <style>
      .bg{fill:#f4f4f5}.board{fill:#fff;stroke:#d4d4d8}.frame{fill:#fafafa;stroke:#a1a1aa;stroke-width:2}.shell{fill:#fff;stroke:#d4d4d8}.muted{fill:#e4e4e7}.soft{fill:#f4f4f5}.dark{fill:#27272a}.line{stroke:#a1a1aa;stroke-width:2}.thin{stroke:#d4d4d8}.txt{font-family:Inter,Arial,sans-serif;fill:#27272a}.h1{font-size:28px;font-weight:700}.h2{font-size:17px;font-weight:700}.body{font-size:13px}.small{font-size:11px;fill:#71717a}.label{font-size:12px;font-weight:700;letter-spacing:.06em;fill:#52525b}.white{fill:#fff}.unread{fill:#eef2ff}.accent{fill:#4f46e5}.danger{fill:#ef4444}.dash{fill:none;stroke:#a1a1aa;stroke-width:2;stroke-dasharray:6 6}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1200"/>
  <rect class="board" x="30" y="30" width="1540" height="1140" rx="24"/>
  <text class="txt h1" x="70" y="88">Gray CSM — Global Notifications Layer</text>
  <text class="txt body" x="70" y="116">Low-fidelity wireframe • awareness layer, not an operational inbox • V1</text>

  <!-- 01 desktop default -->
  <g transform="translate(70 155)">
    <text class="txt label" y="-14">01 — DESKTOP / DEFAULT</text>
    <rect class="frame" width="700" height="430" rx="14"/>
    <rect class="shell" x="0" y="0" width="700" height="54" rx="14"/>
    <rect class="muted" x="18" y="17" width="22" height="20" rx="4"/>
    <rect class="muted" x="55" y="18" width="120" height="16" rx="4"/>
    <circle class="soft" cx="580" cy="27" r="16"/><circle class="dark" cx="580" cy="27" r="6"/>
    <circle class="soft" cx="625" cy="27" r="16"/><circle class="accent" cx="636" cy="16" r="9"/>
    <text class="txt white small" x="633" y="20" text-anchor="middle">5</text>
    <circle class="muted" cx="670" cy="27" r="16"/>
    <rect class="muted" x="20" y="76" width="190" height="330" rx="9"/>
    <rect class="soft" x="235" y="76" width="220" height="120" rx="9"/>
    <rect class="soft" x="235" y="215" width="220" height="190" rx="9"/>

    <rect class="shell" x="270" y="66" width="410" height="350" rx="12"/>
    <text class="txt h2" x="292" y="96">Notifications</text>
    <rect class="soft" x="402" y="78" width="28" height="22" rx="11"/><text class="txt small" x="416" y="93" text-anchor="middle">5</text>
    <text class="txt small" x="557" y="94">Mark all as read</text><text class="txt body" x="655" y="94">×</text>
    <line class="thin" x1="270" y1="112" x2="680" y2="112"/>
    <rect class="dark" x="292" y="126" width="42" height="26" rx="13"/><text class="txt white small" x="313" y="143" text-anchor="middle">All</text>
    <rect class="soft" x="340" y="126" width="58" height="26" rx="13"/><text class="txt small" x="369" y="143" text-anchor="middle">Unread</text>
    <text class="txt label" x="292" y="177">TODAY</text>
    <rect class="unread" x="282" y="188" width="388" height="66" rx="8"/>
    <circle class="muted" cx="310" cy="215" r="17"/><circle class="accent" cx="660" cy="202" r="4"/>
    <text class="txt body" x="338" y="210"><tspan font-weight="700">Sarah Chen</tspan> mentioned you in Ticket #2048</text>
    <text class="txt small" x="338" y="231">“Can you confirm the refund policy?” • 5m</text>
    <rect class="shell" x="282" y="260" width="388" height="66" rx="8"/>
    <circle class="muted" cx="310" cy="287" r="17"/><path class="danger" d="M304 280h12v14h-12z"/>
    <text class="txt body" x="338" y="282"><tspan font-weight="700">SLA breached</tspan> on Ticket #1984</text>
    <text class="txt small" x="338" y="303">Enterprise renewal blocked • 12m</text>
    <text class="txt label" x="292" y="349">YESTERDAY</text>
    <rect class="shell" x="282" y="360" width="388" height="45" rx="8"/>
    <text class="txt body" x="302" y="388">Knowledge article “Refund policy” needs review</text>
  </g>

  <!-- 02 unread filtered -->
  <g transform="translate(830 155)">
    <text class="txt label" y="-14">02 — DESKTOP / UNREAD FILTER</text>
    <rect class="frame" width="700" height="430" rx="14"/>
    <rect class="muted" x="18" y="20" width="190" height="390" rx="9"/>
    <rect class="soft" x="230" y="20" width="190" height="130" rx="9"/>
    <rect class="shell" x="270" y="32" width="410" height="380" rx="12"/>
    <text class="txt h2" x="292" y="64">Notifications</text><text class="txt small" x="557" y="62">Mark all as read</text><text class="txt body" x="655" y="64">×</text>
    <line class="thin" x1="270" y1="80" x2="680" y2="80"/>
    <rect class="soft" x="292" y="94" width="42" height="26" rx="13"/><text class="txt small" x="313" y="111" text-anchor="middle">All</text>
    <rect class="dark" x="340" y="94" width="58" height="26" rx="13"/><text class="txt white small" x="369" y="111" text-anchor="middle">Unread</text>
    <text class="txt label" x="292" y="146">TODAY</text>
    <rect class="unread" x="282" y="157" width="388" height="70" rx="8"/>
    <circle class="muted" cx="310" cy="186" r="17"/><circle class="accent" cx="660" cy="170" r="4"/>
    <text class="txt body" x="338" y="181"><tspan font-weight="700">Customer replied</tspan> to Ticket #2112</text><text class="txt small" x="338" y="202">Assigned to you • 3m</text>
    <rect class="unread" x="282" y="233" width="388" height="70" rx="8"/>
    <circle class="muted" cx="310" cy="262" r="17"/><circle class="accent" cx="660" cy="246" r="4"/>
    <text class="txt body" x="338" y="257"><tspan font-weight="700">Automation failed</tspan> for routing rule</text><text class="txt small" x="338" y="278">VIP escalation • 18m</text>
    <rect class="unread" x="282" y="309" width="388" height="70" rx="8"/>
    <circle class="muted" cx="310" cy="338" r="17"/><circle class="accent" cx="660" cy="322" r="4"/>
    <text class="txt body" x="338" y="333"><tspan font-weight="700">Ticket #2074</tspan> was assigned to you</text><text class="txt small" x="338" y="354">Billing question • 42m</text>
  </g>

  <!-- 03 all read -->
  <g transform="translate(70 650)">
    <text class="txt label" y="-14">03 — ALL READ</text>
    <rect class="frame" width="460" height="220" rx="14"/>
    <rect class="shell" x="112" y="18" width="330" height="184" rx="12"/>
    <text class="txt h2" x="132" y="50">Notifications</text><text class="txt body" x="420" y="50">×</text>
    <line class="thin" x1="112" y1="66" x2="442" y2="66"/>
    <rect class="soft" x="124" y="79" width="306" height="48" rx="8"/>
    <text class="txt body" x="143" y="100">Ticket #1984 was resolved</text><text class="txt small" x="143" y="117">Yesterday</text>
    <rect class="soft" x="124" y="133" width="306" height="48" rx="8"/>
    <text class="txt body" x="143" y="154">Article review completed</text><text class="txt small" x="143" y="171">2 days ago</text>
  </g>

  <!-- 04 empty -->
  <g transform="translate(570 650)">
    <text class="txt label" y="-14">04 — EMPTY</text>
    <rect class="frame" width="460" height="220" rx="14"/>
    <rect class="shell" x="112" y="18" width="330" height="184" rx="12"/>
    <text class="txt h2" x="132" y="50">Notifications</text><text class="txt body" x="420" y="50">×</text>
    <circle class="soft" cx="277" cy="104" r="25"/><path class="line" fill="none" d="M269 110h16m-13-2v-10a5 5 0 0 1 10 0v10"/>
    <text class="txt body" x="277" y="145" text-anchor="middle" font-weight="700">You’re all caught up</text>
    <text class="txt small" x="277" y="165" text-anchor="middle">New updates will appear here.</text>
  </g>

  <!-- 05 loading -->
  <g transform="translate(1070 650)">
    <text class="txt label" y="-14">05 — LOADING</text>
    <rect class="frame" width="460" height="220" rx="14"/>
    <rect class="shell" x="112" y="18" width="330" height="184" rx="12"/>
    <rect class="muted" x="132" y="37" width="105" height="18" rx="5"/>
    <line class="thin" x1="112" y1="66" x2="442" y2="66"/>
    <circle class="muted" cx="148" cy="94" r="16"/><rect class="muted" x="174" y="79" width="190" height="10" rx="5"/><rect class="soft" x="174" y="96" width="145" height="9" rx="4"/>
    <circle class="muted" cx="148" cy="143" r="16"/><rect class="muted" x="174" y="128" width="205" height="10" rx="5"/><rect class="soft" x="174" y="145" width="125" height="9" rx="4"/>
    <circle class="muted" cx="148" cy="192" r="16"/><rect class="muted" x="174" y="177" width="175" height="10" rx="5"/>
  </g>

  <!-- 06 compact -->
  <g transform="translate(70 925)">
    <text class="txt label" y="-14">06 — COMPACT VIEWPORT / RIGHT SHEET</text>
    <rect class="frame" width="1460" height="190" rx="14"/>
    <rect class="muted" x="18" y="18" width="620" height="154" rx="9"/>
    <rect class="shell" x="880" y="0" width="580" height="190" rx="12"/>
    <text class="txt h2" x="906" y="36">Notifications</text><text class="txt small" x="1270" y="35">Mark all as read</text><text class="txt body" x="1428" y="36">×</text>
    <line class="thin" x1="880" y1="53" x2="1460" y2="53"/>
    <rect class="dark" x="906" y="66" width="42" height="26" rx="13"/><text class="txt white small" x="927" y="83" text-anchor="middle">All</text>
    <rect class="soft" x="954" y="66" width="58" height="26" rx="13"/><text class="txt small" x="983" y="83" text-anchor="middle">Unread</text>
    <rect class="unread" x="895" y="103" width="545" height="65" rx="8"/>
    <circle class="muted" cx="925" cy="133" r="17"/><circle class="accent" cx="1428" cy="116" r="4"/>
    <text class="txt body" x="954" y="128"><tspan font-weight="700">Sarah Chen</tspan> mentioned you in Ticket #2048</text>
    <text class="txt small" x="954" y="149">Tap item → mark read → close sheet → open destination</text>
    <path class="dash" d="M850 10v170"/>
    <text class="txt small" x="770" y="95" text-anchor="middle">workspace remains behind sheet</text>
  </g>
</svg>
